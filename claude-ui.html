<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Prototype - Interactive</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#252423',
              sidebar: '#1E1D1C',
              surface: '#333230',
              input: '#3E3D3A',
              text: '#EAE9E6',
              muted: '#A3A19E',
              border: '#454341',
              accent: '#E6A26B',
              hover: '#3E3D3A',
              chatBg: '#2A2928'
            }
          },
          fontFamily: {
            serif: ['"Tiempos Headline"', 'Georgia', 'serif'],
            sans: ['"Söhne"', 'Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #252423;
      color: #EAE9E6;
      font-family: "Söhne", Inter, system-ui, sans-serif;
      margin: 0;
      overflow: hidden;
    }
    
    /* Custom scrollbar */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #454341;
      border-radius: 4px;
    }
    .custom-scroll:hover::-webkit-scrollbar-thumb {
      background: #5A5856;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- ICON COMPONENTS ---
    const IconSearch = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>;
    const IconSidebar = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>;
    const IconEdit = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>;
    const IconMessage = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>;
    const IconFolder = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>;
    const IconShapes = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>;
    const IconCode = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>;
    const IconSliders = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>;
    const IconFilter = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>;
    const IconDownload = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;
    const IconDots = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>;
    const IconPlus = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const IconMic = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>;
    const IconWave = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 4v16"></path><path d="M8 8v8"></path><path d="M16 8v8"></path><path d="M4 11v2"></path><path d="M20 11v2"></path></svg>;
    const IconChevronDown = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 12 15 18 9"></polyline></svg>;
    const IconShare = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>;
    const IconFileText = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;
    const IconScrollDown = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>;
    const IconBlueSquare = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="#6B9CE6" stroke="none"><rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect></svg>;
    const IconSend = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>;
    const IconMenu = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>;

    // --- REUSABLE COMPONENTS ---
    const SidebarItem = ({ icon, text, badge }) => (
      <button className="w-full flex items-center gap-3 px-3 py-2 text-brand-text hover:bg-brand-hover rounded-lg group transition-colors">
        <div className="text-brand-muted group-hover:text-brand-text transition-colors">
          {icon}
        </div>
        <span className="text-sm font-medium">{text}</span>
        {badge && (
          <span className="ml-auto text-[10px] uppercase font-bold tracking-wider text-[#A17C3D] bg-[#3B3019] px-1.5 py-0.5 rounded">
            {badge}
          </span>
        )}
      </button>
    );

    const SidebarChat = ({ text, active }) => (
      <button className={`w-full flex items-center justify-between px-3 py-2 text-sm rounded-lg transition-colors ${active ? 'bg-brand-hover text-brand-text' : 'text-brand-muted hover:bg-brand-hover hover:text-brand-text'}`}>
        <span className="truncate">{text}</span>
        {active && <span className="text-brand-muted ml-2"><IconDots /></span>}
      </button>
    );

    const SidebarFolderChat = ({ text }) => (
      <button className="w-full flex items-center gap-2 px-3 py-2 text-sm text-brand-muted hover:bg-brand-hover hover:text-brand-text rounded-lg transition-colors">
        <div className="text-brand-muted">
          <IconFolder />
        </div>
        <span className="truncate">{text}</span>
      </button>
    );

    const App = () => {
      const [isSidebarOpen, setIsSidebarOpen] = useState(window.innerWidth > 768);
      const [inputText, setInputText] = useState("");
      const [isModelDropdownOpen, setIsModelDropdownOpen] = useState(false);
      const [selectedModel, setSelectedModel] = useState("Sonnet 4.6");

      // Handle window resize for responsive sidebar
      useEffect(() => {
        const handleResize = () => {
          if (window.innerWidth <= 768) {
            setIsSidebarOpen(false);
          } else {
            setIsSidebarOpen(true);
          }
        };
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const toggleSidebar = () => setIsSidebarOpen(!isSidebarOpen);

      return (
        <div className="flex h-screen w-full bg-brand-bg text-brand-text relative overflow-hidden">
          
          {/* MOBILE OVERLAY (dim background when sidebar is open on small screens) */}
          {isSidebarOpen && (
            <div 
              className="md:hidden fixed inset-0 bg-black/50 z-20 transition-opacity" 
              onClick={() => setIsSidebarOpen(false)}
            />
          )}

          {/* SIDEBAR */}
          <aside 
            className={`fixed md:relative top-0 left-0 h-full w-[260px] bg-brand-sidebar border-r border-brand-border flex flex-col z-30 transition-transform duration-300 ease-in-out ${
              isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0 md:hidden'
            }`}
          >
            {/* Sidebar Top */}
            <div className="p-3">
              <div className="flex items-center justify-between mb-4 px-1">
                <div className="font-serif text-lg font-medium">Claude</div>
                <div className="flex items-center gap-2 text-brand-muted">
                  <button className="p-1 hover:text-brand-text transition-colors"><IconSearch /></button>
                  <button className="p-1 hover:text-brand-text transition-colors" onClick={toggleSidebar}>
                    <IconSidebar />
                  </button>
                </div>
              </div>
              
              <button className="w-full flex items-center justify-center gap-2 py-2 mb-4 bg-transparent border border-brand-border text-brand-text rounded-lg font-medium text-sm hover:bg-brand-hover transition-colors">
                <IconEdit />
                New chat
              </button>

              <div className="space-y-0.5">
                <SidebarItem icon={<IconMessage />} text="Chats" />
                <SidebarItem icon={<IconFolder />} text="Projects" />
                <SidebarItem icon={<IconShapes />} text="Artifacts" />
                <SidebarItem icon={<IconCode />} text="Code" badge="Upgrade" />
                <SidebarItem icon={<IconSliders />} text="Customize" />
              </div>
            </div>

            {/* Sidebar Scrollable Area */}
            <div className="flex-1 overflow-y-auto custom-scroll px-3 pb-4">
              <div className="mt-4 mb-2 px-3">
                <h3 className="text-xs font-semibold text-brand-muted">Starred</h3>
              </div>
              <div className="space-y-0.5 mb-6">
                <SidebarFolderChat text="Nextleap Grad project" />
                <SidebarFolderChat text="Office CEO" />
                <SidebarFolderChat text="PM_Projects" />
              </div>

              <div className="mb-2 px-3 flex items-center justify-between">
                <h3 className="text-xs font-semibold text-brand-muted">Recents</h3>
                <button className="text-brand-muted hover:text-brand-text"><IconFilter /></button>
              </div>
              <div className="space-y-0.5">
                <SidebarChat text="PC69 ke liye system optimizatio..." />
                <SidebarChat text="NextLeap graduation project co..." active={true} />
                <SidebarChat text="Critical feedback on slide 1 analy..." />
                <SidebarChat text="Analyzing ethics and stating per..." />
                <SidebarChat text="Analysis confirmation request" />
                <SidebarChat text="Synthetic survey data generatio..." />
                <SidebarChat text="Gemini model selection for Her..." />
                <SidebarChat text="9 din mein 9 slide decks" />
              </div>
            </div>

            {/* User Profile Area */}
            <div className="p-3 border-t border-brand-border">
              <div className="flex items-center gap-3 px-2 py-1.5 hover:bg-brand-hover rounded-lg cursor-pointer transition-colors">
                <div className="w-8 h-8 rounded-full bg-[#5E7958] flex items-center justify-center text-sm font-medium text-white flex-shrink-0">
                  S
                </div>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-medium truncate">Sonu</div>
                  <div className="text-xs text-brand-muted">Free plan</div>
                </div>
                <div className="flex items-center gap-1 text-brand-muted">
                  <button className="p-1 hover:text-brand-text"><IconDownload /></button>
                </div>
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT */}
          <main className="flex-1 flex flex-col relative h-full min-w-0">
            
            {/* Top Navigation Bar */}
            <header className="flex items-center justify-between px-3 md:px-4 py-3 bg-brand-bg border-b border-brand-border z-10 sticky top-0">
              <div className="flex items-center gap-2 md:gap-3 overflow-hidden">
                {!isSidebarOpen && (
                  <button 
                    className="p-1.5 text-brand-muted hover:text-brand-text rounded-md transition-colors flex-shrink-0"
                    onClick={toggleSidebar}
                  >
                    <IconSidebar />
                  </button>
                )}
                <div className="flex items-center gap-1 md:gap-2 text-xs md:text-sm text-brand-muted truncate">
                  <span className="truncate hidden sm:inline">Nextleap Grad project</span>
                  <span className="hidden sm:inline">/</span>
                  <span className="text-brand-text font-medium truncate">NextLeap graduation project...</span>
                  <IconChevronDown />
                </div>
              </div>
              <div className="flex items-center gap-2 md:gap-3 flex-shrink-0 ml-2">
                <button className="p-1.5 text-brand-muted hover:bg-brand-hover rounded-md transition-colors hidden sm:block">
                  <IconFileText />
                </button>
                <button className="flex items-center gap-2 px-3 py-1.5 bg-[#454341] hover:bg-[#5A5856] text-white text-xs md:text-sm font-medium rounded-md transition-colors">
                  <IconShare />
                  <span className="hidden sm:inline">Share</span>
                </button>
              </div>
            </header>

            {/* Scrollable Chat Area */}
            <div className="flex-1 overflow-y-auto custom-scroll flex flex-col items-center pt-4 md:pt-8 pb-36 md:pb-40">
              <div className="w-full max-w-3xl px-4 md:px-6 flex flex-col gap-6">
                
                {/* User Message Block */}
                <div className="flex flex-col gap-3">
                  <div className="bg-brand-chatBg border border-brand-border rounded-xl p-3 md:p-4 text-sm text-brand-text">
                    <p className="mb-3">muje poore slide 2 ka structure kaise kaha konsa karna hai batade ....</p>
                    <p className="text-blue-400 hover:underline cursor-pointer mb-3 truncate">melodykoh.substack.com/p/the-confidence-gap</p>
                    <p className="mb-3">ye bhi exist karta hai ..... refrrence nopt full "-[The Confidence Gap</p>
                    <p className="font-medium">What building a broken AI skill taught me about trusting AI in unfamiliar territory</p>
                    <p className="text-brand-muted">Melody Koh</p>
                    <p className="text-brand-muted">Jan 29, 2026</p>
                    <button className="mt-3 text-brand-muted hover:text-brand-text text-sm">Show more</button>
                  </div>
                  <div className="text-[14px] md:text-[15px] leading-relaxed">
                    Token 🚨 — naya conversation shuru kar. Copy-paste kar yeh block:
                  </div>
                </div>

                <hr className="border-brand-border my-2" />

                {/* Assistant/Context Response */}
                <div className="flex flex-col gap-4 text-[14px] md:text-[15px] leading-relaxed">
                  <h3 className="font-bold text-white text-sm md:text-base">CONTEXT DUMP — SLIDE 2 LOCKED</h3>
                  
                  <div className="pl-3 md:pl-4 border-l-2 border-brand-border space-y-2 text-brand-text">
                    <p>Project: NextLeap Graduation — Claude, PM Growth Team. Deadline June 3.</p>
                    <p>Segment: Mid-career knowledge workers (PMs, analysts, consultants, 3-10 yrs exp)</p>
                    <p>Slide 2 Title: "Mid-Career Knowledge Workers Are Claude's Highest-Stakes, Most Frequent — and Most Vulnerable — User Segment"</p>
                  </div>

                  <h3 className="font-bold text-white mt-4 text-sm md:text-base">TAM/SAM/SOM — LOCKED:</h3>
                  <ul className="list-disc pl-5 space-y-2 text-brand-text marker:text-brand-muted">
                    <li>TAM: $22.2B — Grand View Research, April 2026</li>
                    <li>SAM: ~$9B — North America Gen AI market = 40.8% of TAM</li>
                  </ul>
                </div>

              </div>
            </div>

            {/* Floating Input Area */}
            <div className="absolute bottom-4 md:bottom-6 left-0 right-0 flex justify-center px-2 md:px-6 pointer-events-none">
              <div className="w-full max-w-3xl relative pointer-events-auto">
                
                {/* Scroll Down Button */}
                <button className="absolute -top-10 md:-top-12 right-2 md:right-0 w-8 h-8 rounded-full bg-brand-surface border border-brand-border flex items-center justify-center text-brand-muted shadow-sm hover:bg-brand-hover transition-colors">
                  <IconScrollDown />
                </button>

                <div className="bg-[#333230] border border-brand-border rounded-xl md:rounded-2xl flex flex-col shadow-lg transition-colors focus-within:border-[#5A5856]">
                  <div className="flex items-end md:items-center gap-2 md:gap-3 p-2 md:p-3">
                    <button className="p-1 md:p-1.5 text-brand-muted hover:text-brand-text transition-colors flex-shrink-0">
                      <IconPlus />
                    </button>
                    <button className="p-1 hover:opacity-80 transition-opacity hidden sm:block flex-shrink-0">
                      <IconBlueSquare />
                    </button>
                    
                    <textarea 
                      placeholder="Write a message..." 
                      className="flex-1 bg-transparent border-none text-brand-text placeholder:text-brand-muted resize-none focus:outline-none min-h-[24px] max-h-[120px] py-1 text-[14px] md:text-[15px]"
                      rows="1"
                      value={inputText}
                      onChange={(e) => setInputText(e.target.value)}
                    ></textarea>
                    
                    <div className="flex items-center gap-1 md:gap-2 flex-shrink-0 relative">
                      
                      {/* Model Selector Dropdown */}
                      <div className="relative">
                        <button 
                          onClick={() => setIsModelDropdownOpen(!isModelDropdownOpen)}
                          className="flex items-center gap-1 px-2 py-1 text-[11px] md:text-xs font-medium text-brand-muted hover:bg-brand-hover hover:text-brand-text rounded-md transition-colors whitespace-nowrap"
                        >
                          {selectedModel} <IconChevronDown />
                        </button>
                        
                        {isModelDropdownOpen && (
                          <div className="absolute bottom-full right-0 mb-2 w-36 bg-[#252423] border border-brand-border rounded-lg shadow-xl overflow-hidden z-50">
                            <button 
                              className="w-full text-left px-3 py-2 text-xs md:text-sm text-brand-text hover:bg-brand-hover transition-colors"
                              onClick={() => { setSelectedModel("Sonnet 4.6"); setIsModelDropdownOpen(false); }}
                            >
                              Sonnet 4.6
                            </button>
                            <button 
                              className="w-full text-left px-3 py-2 text-xs md:text-sm text-brand-text hover:bg-brand-hover transition-colors"
                              onClick={() => { setSelectedModel("Haiku 3.5"); setIsModelDropdownOpen(false); }}
                            >
                              Haiku 3.5
                            </button>
                          </div>
                        )}
                      </div>

                      {/* Dynamic Send / Mic / Wave Icons */}
                      {inputText.trim().length > 0 ? (
                        <button className="p-1.5 md:p-2 bg-white text-black rounded-lg hover:bg-gray-200 transition-colors">
                          <IconSend />
                        </button>
                      ) : (
                        <div className="flex">
                          <button className="p-1.5 text-brand-muted hover:text-brand-text transition-colors">
                            <IconMic />
                          </button>
                          <button className="p-1.5 text-brand-muted hover:text-brand-text transition-colors hidden sm:block">
                            <IconWave />
                          </button>
                        </div>
                      )}
                      
                    </div>
                  </div>
                </div>
                
                <div className="text-center mt-2 hidden sm:block">
                  <span className="text-[11px] text-brand-muted">Mistakes. Please double-check responses.</span>
                </div>
                
              </div>
            </div>

          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
